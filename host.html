<body><header><span aria-hidden="true">♠</span> Last Chance Casino</header>
<main><h1>Host desk</h1><p id="storage" hidden role="status"></p><section id="desk" class="paper" aria-live="polite"><h2>Open your host invitation</h2><p>Use the <strong>Open host controls</strong> link in the hosts’ shared Google Doc.</p><a href="./">Go to the player site</a></section></main>
<dialog id="reset-dialog"><h2>Reset this run?</h2><p>This clears the timer, cue position, and setup checks on this browser.</p><div class="actions"><button id="cancel-reset" class="primary">Keep this run</button><button id="confirm-reset">Reset run</button></div></dialog>

const desk=document.getElementById('desk');
const dialog=document.getElementById('reset-dialog');
const storageKey='dmh-host-run-v1';
let game, run;
const blank=()=>({started:0,ended:0,step:-1,checked:[]});
function loadRun(){
 try{
  const x=JSON.parse(localStorage.getItem(storageKey)||'null');
  if(x && Number.isFinite(x.started) && x.started>=0 && Number.isFinite(x.ended) && x.ended>=0 && Number.isInteger(x.step) && x.step>=-1 && x.step<game.cues.length && Array.isArray(x.checked))return x;
 }catch{}
 return blank();
}
function save(){
 try{localStorage.setItem(storageKey,JSON.stringify(run))}
 catch{const label=document.getElementById('storage');label.hidden=false;label.textContent='This browser cannot save progress. Keep this tab open for the party.'}
}
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function button(text,action,primary){const b=element('button',text,primary?'primary':'');b.type='button';b.onclick=action;return b}
function setCue(index){run.step=index;save();render(true)}
function elapsed(){const total=Math.max(0,Math.floor(((run.ended||Date.now())-run.started)/1000));return Math.floor(total/60)+'m '+String(total%60).padStart(2,'0')+'s'}
function clockTick(){const clock=document.getElementById('clock');if(clock)clock.textContent=elapsed()}
function toolsPanel(){
 const details=element('details');details.append(element('summary','Run options'));
 const startOver=button('Reset this run',()=>dialog.showModal());
 const guest=element('a','Open guest site');guest.href='./';guest.target='_blank';guest.rel='noopener noreferrer';
 details.append(guest,element('p'),startOver);return details;
}
function render(focus){
 desk.replaceChildren();desk.removeAttribute('aria-live');
 let heading;
 if(run.step===-1){
  heading=element('h2','Before guests arrive');desk.append(heading,element('p','Use one phone or computer for the night. You move the cues when the room is ready. The timer starts when you open the casino.'));
  game.checks.forEach((item,i)=>{const label=element('label');const check=element('input');check.type='checkbox';check.checked=run.checked.includes(i);check.onchange=()=>{run.checked=run.checked.filter(x=>x!==i);if(check.checked)run.checked.push(i);save()};label.append(check,element('span',item));desk.append(label)});
  const actions=element('div',undefined,'actions');actions.append(button('Start casino hour',()=>{run.started=Date.now();run.ended=0;setCue(0)},true));desk.append(actions,toolsPanel());
 }else{
  const cue=game.cues[run.step],bar=element('div',undefined,'bar'),clock=element('span',elapsed(),'clock');
  clock.id='clock';const timeLabel=element('span',run.ended?'Final time · ':'Elapsed · ');timeLabel.append(clock);
  bar.append(element('span','Cue '+(run.step+1)+' of '+game.cues.length+' · Minute '+cue.at,'tag'),timeLabel);desk.append(bar);
  heading=element('h2',cue.name);desk.append(heading,element('p',cue.action));
  if(cue.say){desk.append(element('h3','Say aloud'),element('blockquote',cue.say));if(cue.after)desk.append(element('blockquote',cue.after))}
  if(cue.code){desk.append(element('h3','Announce this code'),element('code',cue.code))}
  if(cue.hint)desk.append(element('p',cue.hint,'minor'));
  if(cue.reveal||cue.score){const fold=element('details');fold.append(element('summary',cue.reveal?'Show final reveal':'Show scoring key'));for(const line of cue.reveal||cue.score)fold.append(element('p',line));desk.append(fold)}
  const controls=element('div',undefined,'actions');
  if(run.step>0)controls.append(button('Previous cue',()=>setCue(run.step-1)));
  if(run.step<game.cues.length-1)controls.append(button('Next cue',()=>setCue(run.step+1),true));
  else if(!run.ended)controls.append(button('Finish game',()=>{run.ended=Date.now();save();render(true)},true));
  desk.append(controls);
  const next=game.cues[run.step+1];
  if(next)desk.append(element('p','Up next at minute '+next.at+' · '+next.name,'minor'));
  else if(run.ended)desk.append(element('p','Game complete. The timer has stopped.','minor'));
  desk.append(toolsPanel());
 }
 if(focus){heading.tabIndex=-1;heading.focus({preventScroll:true});window.scrollTo(0,0)}
}
document.getElementById('cancel-reset').onclick=()=>dialog.close();
document.getElementById('confirm-reset').onclick=()=>{dialog.close();run=blank();save();render(true)};
async function openHost(){
 const fragment=location.hash.slice(1);
 if(!/^[A-Za-z0-9_-]{43}$/.test(fragment))return;
 try{
  const decode=val=>Uint8Array.from(atob(val),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',decode(fragment.replace(/-/g,'+').replace(/_/g,'/')),'AES-GCM',false,['decrypt']);
  const bytes=decode(sealed);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));
  game=JSON.parse(new TextDecoder().decode(clear));
  run=loadRun();render(false);setInterval(clockTick,1000);
 }catch{desk.firstElementChild.textContent='Reopen your host invitation';desk.querySelector('p').textContent='This link did not open the controls. Use the full link in the hosts’ shared Google Doc.'}
}
openHost();
</script></body></html>
